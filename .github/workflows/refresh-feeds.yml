name: Refresh Pepper Ad Feeds
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all feeds
        env:
          PEPPER_API_KEY: ${{ secrets.PEPPER_API_KEY }}
        run: |
          BASE="https://marketing.pepper.com/feeds/ads"
          mkdir -p feeds

          FEEDS=(
            "uk:uk"
            "de:de"
            "fr:fr"
            "es:es"
            "mx/merchant/85:mx-merchant-85"
          )

          for entry in "${FEEDS[@]}"; do
            path="${entry%%:*}"
            base="${entry##*:}"
            echo "Fetching $path"
            curl -sf -H "Authorization: Bearer $PEPPER_API_KEY" \
              "$BASE/$path" -o "feeds/_tmp.json" \
              || { echo "Failed: $path"; continue; }

            if [[ "$path" == *merchant* ]]; then
              existing=$(ls feeds/${base}-*.json 2>/dev/null | head -1)
              if [ -n "$existing" ]; then
                mv "feeds/_tmp.json" "$existing"
                echo "Updated: $existing"
              else
                merchant=$(python3 -c "import json,re,sys; d=json.load(open('feeds/_tmp.json')); items=d.get('data',d) if isinstance(d,dict) else d; mn=items[0].get('merchantName','') if isinstance(items,list) and items else (d.get('merchantName','') if isinstance(d,dict) else ''); print(re.sub(r'[^a-z0-9]+','-',mn.lower()).strip('-'))" 2>/dev/null || echo "")
                final="feeds/${base}${merchant:+-${merchant}}.json"
                mv "feeds/_tmp.json" "$final"
                echo "Created: $final"
              fi
            else
              mv "feeds/_tmp.json" "feeds/${base}.json"
              echo "Updated: feeds/${base}.json"
            fi
          done

      - name: Update README
        run: |
          python3 - << 'PYEOF'
          import os
          from datetime import datetime, timezone

          RAW_BASE = "https://raw.githubusercontent.com/Fuzznatic/ads-feeds/main"
          FEEDS_DIR = "feeds"
          BRAND_MAP = {
              'uk': 'hotukdeals', 'de': 'mydealz', 'fr': 'dealabs',
              'es': 'chollometro', 'mx': 'promodescuentos',
              'nl': 'pepper.com NL', 'it': 'pepper.com IT', 'pl': 'pepper.com PL',
          }

          locale_feeds, merchant_feeds, category_feeds = [], [], []

          for fname in sorted(os.listdir(FEEDS_DIR)):
              if not fname.endswith('.json'):
                  continue
              url = RAW_BASE + "/" + FEEDS_DIR + "/" + fname
              name = fname[:-5]
              if 'merchant' in name:
                  parts = name.split('-merchant-', 1)
                  locale = parts[0].upper()
                  rest = parts[1] if len(parts) > 1 else ''
                  id_part = rest.split('-')[0]
                  label_parts = rest.split('-')[1:]
                  label_name = ' '.join(p.capitalize() for p in label_parts)
                  label = locale + " Merchant " + id_part + (" (" + label_name + ")" if label_name else "")
                  merchant_feeds.append((label, url))
              elif 'cat' in name:
                  parts = name.split('-cat-', 1)
                  locale = parts[0].upper()
                  cat_id = parts[1] if len(parts) > 1 else ''
                  category_feeds.append((locale + " Category " + cat_id, url))
              else:
                  brand = BRAND_MAP.get(name, name.upper())
                  locale_feeds.append((name.upper() + " (" + brand + ")", url))

          def table(rows):
              if not rows:
                  return '_None configured yet._'
              lines = ['| Feed | Raw URL |', '|------|---------|']
              for label, url in rows:
                  lines.append('| ' + label + ' | `' + url + '` |')
              return '\n'.join(lines)

          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')

          readme = "\n".join([
              "# ads-feeds",
              "",
              "Automated feed cache for Atolls / Pepper ad creatives.",
              "GitHub Actions fetches from the Pepper Marketing API every 6 hours using a secret API key",
              "and commits the results as static JSON. Banners fetch from raw GitHub URLs — no API key",
              "is ever exposed in any creative.",
              "",
              "> Last updated: **" + now + "**",
              "",
              "---",
              "",
              "## Feed URLs (use these in banners)",
              "",
              "### Locale Feeds",
              table(locale_feeds),
              "",
              "### Merchant Feeds",
              table(merchant_feeds),
              "",
              "### Category Feeds",
              table(category_feeds),
              "",
              "---",
              "",
              "## How to add a new feed",
              "",
              "Edit `.github/workflows/refresh-feeds.yml` and add one line to the `FEEDS` array:",
              "",
              "```bash",
              "# Locale feed:    \"LOCALE:LOCALE\"",
              "# Merchant feed:  \"LOCALE/merchant/ID:LOCALE-merchant-ID\"",
              "# Category feed:  \"LOCALE/ID:LOCALE-cat-ID\"",
              "```",
              "",
              "Then: **Actions -> Refresh Pepper Ad Feeds -> Run workflow**",
              "",
              "Merchant filenames are set on the first run using the `merchantName` field from the API",
              "and stay stable on all subsequent runs.",
              "",
              "---",
              "",
              "## How it works",
              "",
              "```",
              "GitHub Actions (every 6h, cron: 0 */6 * * *)",
              "  fetch Pepper Marketing API with secret PEPPER_API_KEY",
              "  save as feeds/*.json",
              "  update this README",
              "",
              "GAM banner (in user browser)",
              "  fetch raw.githubusercontent.com/Fuzznatic/ads-feeds/main/feeds/NAME.json",
              "  public, no API key needed, renders live deals",
              "```",
              "",
              "---",
              "",
              "## Setup (one-time)",
              "",
              "1. Settings -> Secrets and variables -> Actions -> New secret",
              "   Name: `PEPPER_API_KEY` | Value: your Pepper Marketing API key",
              "2. Commit `.github/workflows/refresh-feeds.yml` to `main`",
              "3. Actions -> Refresh Pepper Ad Feeds -> Run workflow",
              "",
              "Cron: `0 */6 * * *` (00:00, 06:00, 12:00, 18:00 UTC)",
          ])

          with open('README.md', 'w') as f:
              f.write(readme)
          print("README.md updated")
          PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/ README.md
          git diff --cached --quiet || git commit -m "chore: refresh feeds $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
