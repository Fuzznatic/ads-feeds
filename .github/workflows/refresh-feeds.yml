name: Refresh Pepper Ad Feeds

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch feeds from Pepper API
        env:
          PEPPER_API_KEY: ${{ secrets.PEPPER_API_KEY }}
        run: |
          mkdir -p feeds
          for locale in de fr uk at pl mx nl se; do
            echo "Fetching $locale..."
            HTTP_STATUS=$(curl -s -o "feeds/${locale}.json" -w "%{http_code}" \
              -H "api-key: ${PEPPER_API_KEY}" \
              "https://marketing.pepper.com/feeds/ads/${locale}")
            echo "$locale: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ]; then
              echo '{"data":[]}' > "feeds/${locale}.json"
            fi
          done

      - name: Commit and push if feeds changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh ad feeds [skip ci]"
          file_pattern: "feeds/*.json"
