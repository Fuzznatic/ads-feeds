name: Refresh Pepper Ad Feeds

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch feeds from Pepper API
        env:
          PEPPER_API_KEY: ${{ secrets.PEPPER_API_KEY }}
        run: |
          mkdir -p feeds
          for locale in de fr uk at pl mx nl se; do
            echo "Fetching $locale..."
            HTTP_STATUS=$(curl -s -o "feeds/${locale}.json" -w "%{http_code}" \
              -H "api-key: ${PEPPER_API_KEY}" \
              "https://marketing.pepper.com/feeds/ads/${locale}")
            echo "$locale: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ]; then
              echo '{"data":[]}' > "feeds/${locale}.json"
            fi
          done

      - name: Commit and push if feeds changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git fetch origin main
            git rebase origin/main
            git commit -m "chore: refresh ad feeds [skip ci]"
            git push --force-with-lease
          fi
