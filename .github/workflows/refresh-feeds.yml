name: Refresh Pepper Ad Feeds
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all feeds
        env:
          PEPPER_API_KEY: ${{ secrets.PEPPER_API_KEY }}
        run: |
          BASE="https://marketing.pepper.com/feeds/ads"
          mkdir -p feeds

          # Format: "api-path:output-base-name"
          # Locale feed:   "locale/:locale"
          # Merchant feed: "locale/merchant/id/:locale-merchant-id"
               FEEDS=(
            "uk:uk"
            "de:de"
            "fr:fr"
            "es:es"
            "mx:mx"
            "at:at"
            "nl:nl"
            "pl:pl"
            "se:se"
            "mx/merchant/85:mx-merchant-85"
          )

          for entry in "${FEEDS[@]}"; do
            path="${entry%%:*}"
            base="${entry##*:}"
            echo "Fetching $path"

            HTTP_STATUS=$(curl -s -o "feeds/_tmp.json" -w "%{http_code}" \
              -H "api-key: ${PEPPER_API_KEY}" \
              "$BASE/$path")

            if [ "$HTTP_STATUS" != "200" ]; then
              echo "Failed: $path (HTTP $HTTP_STATUS)"
              rm -f "feeds/_tmp.json"
              continue
            fi

            if [[ "$path" == *merchant* ]]; then
              existing=$(ls feeds/${base}-*.json 2>/dev/null | head -1)
              if [ -n "$existing" ]; then
                mv "feeds/_tmp.json" "$existing"
                echo "Updated: $existing"
              else
                merchant=$(python3 -c "import json,re; d=json.load(open('feeds/_tmp.json')); items=d.get('data',d) if isinstance(d,dict) else d; mn=items[0].get('merchantName','') if isinstance(items,list) and items else (d.get('merchantName','') if isinstance(d,dict) else ''); print(re.sub(r'[^a-z0-9]+','-',mn.lower()).strip('-'))" 2>/dev/null || echo "")
                final="feeds/${base}${merchant:+-${merchant}}.json"
                mv "feeds/_tmp.json" "$final"
                echo "Created: $final"
              fi
            else
              mv "feeds/_tmp.json" "feeds/${base}.json"
              echo "Updated: feeds/${base}.json"
            fi
          done

      - name: Update README
        run: |
          NOW=$(date -u +"%Y-%m-%d %H:%M UTC")
          RAW="https://raw.githubusercontent.com/Fuzznatic/ads-feeds/main/feeds"

          {
            echo "# ads-feeds"
            echo ""
            echo "Automated feed cache for Atolls / Pepper ad creatives."
            echo "GitHub Actions fetches from the Pepper Marketing API every 6 hours using a secret API key"
            echo "and commits the results as static JSON. Banners fetch from raw GitHub URLs — no API key"
            echo "is ever exposed in any creative."
            echo ""
            echo "> Last updated: **${NOW}**"
            echo ""
            echo "---"
            echo ""
            echo "## Feed URLs (use these in banners)"
            echo ""
            echo "### Locale Feeds"
            echo "| Feed | Raw URL |"
            echo "|------|---------|"
            for f in $(ls feeds/*.json 2>/dev/null | sort); do
              n=$(basename "$f" .json)
              [[ "$n" == *merchant* || "$n" == *cat* ]] && continue
              declare -A B=([uk]="hotukdeals" [de]="mydealz" [fr]="dealabs" [es]="chollometro" [mx]="promodescuentos" [at]="pepper.com AT" [nl]="pepper.com NL" [pl]="pepper.com PL" [se]="pepper.com SE")
              brand="${B[$n]:-$n}"
              echo "| ${n^^} (${brand}) | \`${RAW}/${n}.json\` |"
            done
            echo ""
            echo "### Merchant Feeds"
            echo "| Feed | Raw URL |"
            echo "|------|---------|"
            for f in $(ls feeds/*merchant*.json 2>/dev/null | sort); do
              n=$(basename "$f" .json)
              echo "| ${n} | \`${RAW}/${n}.json\` |"
            done
            echo ""
            echo "### Category Feeds"
            echo "| Feed | Raw URL |"
            echo "|------|---------|"
            for f in $(ls feeds/*cat*.json 2>/dev/null | sort); do
              n=$(basename "$f" .json)
              echo "| ${n} | \`${RAW}/${n}.json\` |"
            done
            echo ""
            echo "---"
            echo ""
            echo "## How to add a new feed"
            echo ""
            echo "Edit \`.github/workflows/refresh-feeds.yml\` and add one line to the FEEDS array:"
            echo ""
            echo "\`\`\`bash"
            echo "# Locale feed:    \"locale/:locale\""
            echo "# Merchant feed:  \"locale/merchant/id/:locale-merchant-id\""
            echo "# Category feed:  \"locale/id/:locale-cat-id\""
            echo "\`\`\`"
            echo ""
            echo "Then: **Actions -> Refresh Pepper Ad Feeds -> Run workflow**"
            echo ""
            echo "Merchant filenames are set on the first run using the merchantName field"
            echo "from the API and stay stable on all subsequent runs."
            echo ""
            echo "---"
            echo ""
            echo "## How it works"
            echo ""
            echo "\`\`\`"
            echo "GitHub Actions (every 6h, cron: 0 */6 * * *)"
            echo "  fetch Pepper Marketing API with secret PEPPER_API_KEY"
            echo "  save as feeds/*.json"
            echo "  update this README"
            echo ""
            echo "GAM banner (in user browser)"
            echo "  fetch raw.githubusercontent.com/Fuzznatic/ads-feeds/main/feeds/NAME.json"
            echo "  public, no API key needed, renders live deals"
            echo "\`\`\`"
            echo ""
            echo "---"
            echo ""
            echo "## Setup (one-time)"
            echo ""
            echo "1. Settings -> Secrets and variables -> Actions -> New secret"
            echo "   Name: PEPPER_API_KEY | Value: your Pepper Marketing API key"
            echo "2. Commit .github/workflows/refresh-feeds.yml to main"
            echo "3. Actions -> Refresh Pepper Ad Feeds -> Run workflow"
            echo ""
            echo "Cron: 0 */6 * * * (00:00, 06:00, 12:00, 18:00 UTC)"
          } > README.md

          echo "README.md updated"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/ README.md
          git diff --cached --quiet || git commit -m "chore: refresh feeds $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Fuzznatic/ads-feeds.git
