name: Refresh Pepper Ad Feeds
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'creatives/**'
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch all feeds
        env:
          PEPPER_API_KEY: ${{ secrets.PEPPER_API_KEY }}
        run: |
          BASE="https://marketing.pepper.com/feeds/ads"
          mkdir -p feeds
          FEEDS=(
            # ── Locale feeds ──
            "uk:uk"
            "de:de"
            "fr:fr"
            "es:es"
            "mx:mx"
            "at:at"
            "nl:nl"
            "pl:pl"
            "se:se"
            # ── Merchant feeds ──
            "mx/merchant/85:mx-AmazonFeed"
            "uk/merchant/51088:uk-AlibabaFeed"
            "de/merchant/4337:de-AlibabaFeed"
            "de/merchant/3:de-AmazonFeed"
            "uk/merchant/43025:UK-Corsair"
            "pl/merchant/2139:pl-AmazonFeed"
            "uk/merchant/1650:uk-AmazonFeed"
            "fr/merchant/36:fr-AmazonFeed"
            "nl/merchant/69:nl-AmazonFeed"
            "at/merchant/3:at-AmazonFeed"
            # ── Category feeds — convention "locale/threadGroupId:COUNTRY-Category" ──
            # DE
            "de/2:DE-Electronics"
            "de/1:DE-Fashion-Accessories"
            "de/4:DE-Home-Living"
            "de/61:DE-Gaming"
            "de/132:DE-Sports-Outdoor"
            "de/1253:DE-Car-Motorcycle"
            "de/14:DE-Health-Beauty"
            # UK
            "uk/5811:UK-Electronics"
            "uk/5:UK-Fashion-Accessories"
            "uk/19:UK-Gaming"
            "uk/10:UK-Home-Living"
            "uk/21:UK-Sports-Outdoor"
            "uk/343011:UK-Car-Motorcycle"
            # FR
            "fr/1207:FR-Electronics"
            "fr/11:FR-Fashion-Accessories"
            "fr/6:FR-Gaming"
            "fr/1243:FR-Home-Living"
            "fr/641:FR-Car-Motorcycle"
            # PL
            "pl/131:PL-Electronics"
            "pl/5:PL-Fashion-Accessories"
            "pl/19:PL-Gaming"
            "pl/133:PL-Home-Living"
             # NL
            "nl/156:NL-Electronics"
            "nl/5:NL-Fashion-Accessories"
            "nl/19:NL-Gaming"
            "nl/10:NL-Home-Living"
            "nl/157:NL-Sports-Outdoor"
            "nl/159:NL-Car-Motorcycle"
            "nl/20:NL-Health-Beauty"
            # MX
            "mx/14:MX-Electronics"
            "mx/11:MX-Fashion-Accessories"
            "mx/18:MX-Gaming"
            "mx/9:MX-Home-Living"
            "mx/7:MX-Sports-Outdoor"
            "mx/28:MX-Car-Motorcycle"
            "mx/12:MX-Health-Beauty"
          )
          for entry in "${FEEDS[@]}"; do
            path="${entry%%:*}"
            base="${entry##*:}"
            echo "Fetching $path"
            HTTP_STATUS=$(curl -s -o "feeds/_tmp.json" -w "%{http_code}" \
              -H "api-key: ${PEPPER_API_KEY}" \
              "$BASE/$path")
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "Failed: $path (HTTP $HTTP_STATUS)"
              rm -f "feeds/_tmp.json"
              continue
            fi
            if [[ "$path" == *merchant* ]]; then
              existing=$(ls feeds/${base}-*.json 2>/dev/null | head -1)
              if [ -n "$existing" ]; then
                mv "feeds/_tmp.json" "$existing"
                echo "Updated: $existing"
              else
                merchant=$(python3 -c "import json,re; d=json.load(open('feeds/_tmp.json')); items=d.get('data',d) if isinstance(d,dict) else d; mn=items[0].get('merchantName','') if isinstance(items,list) and items else (d.get('merchantName','') if isinstance(d,dict) else ''); print(re.sub(r'[^a-z0-9]+','-',mn.lower()).strip('-'))" 2>/dev/null || echo "")
                final="feeds/${base}${merchant:+-${merchant}}.json"
                mv "feeds/_tmp.json" "$final"
                echo "Created: $final"
              fi
            else
              mv "feeds/_tmp.json" "feeds/${base}.json"
              echo "Updated: feeds/${base}.json"
            fi
          done

      - name: Strip UTM parameters from feed links
        run: |
          python3 - <<'EOF'
          import json, os
          from urllib.parse import urlparse, urlencode, parse_qs, urlunparse

          def strip_utm(url):
              if not url:
                  return url
              p = urlparse(url)
              params = {k: v for k, v in parse_qs(p.query, keep_blank_values=True).items()
                        if not k.startswith('utm_')}
              return urlunparse(p._replace(query=urlencode(params, doseq=True)))

          for fname in os.listdir('feeds'):
              if not fname.endswith('.json'):
                  continue
              path = f'feeds/{fname}'
              with open(path) as f:
                  data = json.load(f)
              items = data.get('data', data) if isinstance(data, dict) else data
              if isinstance(items, list):
                  for item in items:
                      if 'link' in item:
                          item['link'] = strip_utm(item['link'])
              with open(path, 'w') as f:
                  json.dump(data, f, ensure_ascii=False, separators=(',', ':'))
              print(f'Cleaned: {fname}')
          EOF

      - name: Update README
        run: |
          NOW=$(date -u +"%Y-%m-%d %H:%M UTC")
          RAW="https://raw.githubusercontent.com/Fuzznatic/ads-feeds/main/feeds"
          {
            echo "# ads-feeds"
            echo ""
            echo "Automated feed cache for Atolls / Pepper ad creatives."
            echo "GitHub Actions fetches from the Pepper Marketing API every 6 hours using a secret API key"
            echo "and commits the results as static JSON. Banners fetch from raw GitHub URLs — no API key"
            echo "is ever exposed in any creative."
            echo ""
            echo "> Last updated: **${NOW}**"
            echo ""
            echo "---"
            echo ""
            echo "## Feed URLs (use these in banners)"
            echo ""
            echo "### Locale Feeds"
            echo "| Feed | Raw URL |"
            echo "|------|---------|"
            for f in $(ls feeds/*.json 2>/dev/null | sort); do
              n=$(basename "$f" .json)
              [[ "$n" == *merchant* || "$n" == *cat* ]] && continue
              declare -A B=([uk]="hotukdeals" [de]="mydealz" [fr]="dealabs" [es]="chollometro" [mx]="promodescuentos" [at]="pepper.com AT" [nl]="pepper.com NL" [pl]="pepper.com PL" [se]="pepper.com SE")
              brand="${B[$n]:-$n}"
              echo "| ${n^^} (${brand}) | \`${RAW}/${n}.json\` |"
            done
            echo ""
            echo "### Merchant Feeds"
            echo "| Feed | Raw URL |"
            echo "|------|---------|"
            for f in $(ls feeds/*merchant*.json 2>/dev/null | sort); do
              n=$(basename "$f" .json)
              echo "| ${n} | \`${RAW}/${n}.json\` |"
            done
            echo ""
            echo "### Category Feeds"
            echo "| Feed | Raw URL |"
            echo "|------|---------|"
            for f in $(ls feeds/*cat*.json 2>/dev/null | sort); do
              n=$(basename "$f" .json)
              echo "| ${n} | \`${RAW}/${n}.json\` |"
            done
            echo ""
            echo "---"
            echo ""
            echo "## How to add a new feed"
            echo ""
            echo "Edit \`.github/workflows/refresh-feeds.yml\` and add one line to the FEEDS array:"
            echo ""
            echo "\`\`\`bash"
            echo "# Locale feed:    \"locale/:locale\""
            echo "# Merchant feed:  \"locale/merchant/id/:locale-merchant-id\""
            echo "# Category feed:  \"locale/id/:locale-cat-id\""
            echo "\`\`\`"
            echo ""
            echo "Then: **Actions -> Refresh Pepper Ad Feeds -> Run workflow**"
            echo ""
            echo "Merchant filenames are set on the first run using the merchantName field"
            echo "from the API and stay stable on all subsequent runs."
            echo ""
            echo "---"
            echo ""
            echo "## How it works"
            echo ""
            echo "\`\`\`"
            echo "GitHub Actions (every 6h, cron: 0 */6 * * *)"
            echo "  fetch Pepper Marketing API with secret PEPPER_API_KEY"
            echo "  save as feeds/*.json"
            echo "  update this README"
            echo ""
            echo "GAM banner (in user browser)"
            echo "  fetch raw.githubusercontent.com/Fuzznatic/ads-feeds/main/feeds/NAME.json"
            echo "  public, no API key needed, renders live deals"
            echo "\`\`\`"
            echo ""
            echo "---"
            echo ""
            echo "## Setup (one-time)"
            echo ""
            echo "1. Settings -> Secrets and variables -> Actions -> New secret"
            echo "   Name: PEPPER_API_KEY | Value: your Pepper Marketing API key"
            echo "2. Commit .github/workflows/refresh-feeds.yml to main"
            echo "3. Actions -> Refresh Pepper Ad Feeds -> Run workflow"
            echo ""
            echo "Cron: 0 */6 * * * (00:00, 06:00, 12:00, 18:00 UTC)"
          } > README.md
          echo "README.md updated"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/ README.md
          git diff --cached --quiet || git commit -m "chore: refresh feeds $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Fuzznatic/ads-feeds.git main
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Fuzznatic/ads-feeds.git
