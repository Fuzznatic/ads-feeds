name: Refresh Pepper Ad Feeds
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all feeds
        env:
          PEPPER_API_KEY: ${{ secrets.PEPPER_API_KEY }}
        run: |
          BASE="https://marketing.pepper.com/feeds/ads"
          mkdir -p feeds

          FEEDS=(
            "uk:uk"
            "de:de"
            "fr:fr"
            "es:es"
            "mx/merchant/85:mx-merchant-85"
          )

          for entry in "${FEEDS[@]}"; do
            path="${entry%%:*}"
            base="${entry##*:}"
            echo "Fetching $path"
            curl -sf -H "Authorization: Bearer $PEPPER_API_KEY" \
              "$BASE/$path" -o "feeds/_tmp.json" \
              || { echo "Failed: $path"; continue; }

            if [[ "$path" == *merchant* ]]; then
              existing=$(ls feeds/${base}-*.json 2>/dev/null | head -1)
              if [ -n "$existing" ]; then
                mv "feeds/_tmp.json" "$existing"
                echo "Updated: $existing"
              else
                merchant=$(python3 -c "import json,re,sys; d=json.load(open('feeds/_tmp.json')); items=d.get('data',d) if isinstance(d,dict) else d; mn=items[0].get('merchantName','') if isinstance(items,list) and items else (d.get('merchantName','') if isinstance(d,dict) else ''); print(re.sub(r'[^a-z0-9]+','-',mn.lower()).strip('-'))" 2>/dev/null || echo "")
                final="feeds/${base}${merchant:+-${merchant}}.json"
                mv "feeds/_tmp.json" "$final"
                echo "Created: $final"
              fi
            else
              mv "feeds/_tmp.json" "feeds/${base}.json"
              echo "Updated: feeds/${base}.json"
            fi
          done

      - name: Update README
        run: |
          python3 - << 'PYEOF'
          import os
          from datetime import datetime, timezone

          RAW_BASE = "https://raw.githubusercontent.com/Fuzznatic/ads-feeds/main"
          FEEDS_DIR = "feeds"
          BRAND_MAP = {
              'uk': 'hotukdeals', 'de': 'mydealz', 'fr': 'dealabs',
              'es': 'chollometro', 'mx': 'promodescuent
