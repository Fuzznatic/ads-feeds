<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:300px;height:250px;overflow:hidden;background:transparent}
.banner{width:300px;height:250px;font-family:'Inter Tight',system-ui,sans-serif;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative;background:#f0f2f5}
.banner::after{content:'';position:absolute;inset:0;border-radius:12px;border:1px solid rgba(0,0,0,.1);pointer-events:none;z-index:99}
.grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:2px;padding:2px;background:#f0f2f5;overflow:hidden;min-width:0}
.tile{position:relative;overflow:hidden;cursor:pointer;border-radius:4px;background:#fff0e8}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s ease}
.tile:hover img{transform:scale(1.05)}
.tile-overlay{position:absolute;bottom:0;left:0;right:0;max-height:100%;background:linear-gradient(to top,rgba(0,8,16,.95) 0%,rgba(0,8,16,.6) 65%,transparent 100%);padding:8px 8px 7px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden;transform:translateY(100%);opacity:0;transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .33s ease}
.tile-overlay.show{transform:translateY(0);opacity:1}
.tile-title{font-size:11px;font-weight:700;color:#fff;line-height:1.25;overflow:hidden;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile-prow{display:flex;align-items:baseline;gap:3px;flex-wrap:nowrap;margin-top:1px;overflow:hidden;min-width:0}
.tile-was{font-size:10px;color:rgba(255,255,255,.6);text-decoration:line-through;font-weight:600;flex-shrink:0}
.tile-price{font-size:22px;font-weight:900;color:#fff;line-height:1;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
.tile-price.is-temp{color:#E8121A}
.tile-disc{position:absolute;top:6px;right:6px;z-index:3;background:#FB6001;color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;line-height:1.3;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.brand-bar{height:52px;flex-shrink:0;background:#fff;border-top:1px solid #e8eef2;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:10px;position:relative;overflow:hidden}
.brand-info{display:flex;z-index:1;min-width:0;overflow:hidden;flex-direction:column;gap:3px;width:100%}
.bar-div{width:1px;height:0px;background:rgba(0,23,41,.16);flex-shrink:0}
.cta-btn{z-index:1;font-weight:800;border-radius:999px;text-align:center;cursor:pointer;white-space:nowrap;background:#FB6001;color:#fff;font-size:11px;padding:9px 14px;flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.18);animation:shimmer 2.5s ease-in-out infinite;transition:opacity .2s}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.8}}
.cta-btn:hover{opacity:.9}
.slogan{font-weight:600;overflow:hidden;font-size:9px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:rgba(0,23,41,.45)}
.demo-badge{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#f59e0b;color:#000;font-size:9px;font-weight:900;padding:3px 10px;border-radius:999px;letter-spacing:.06em;z-index:98;text-transform:uppercase;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.loading{position:absolute;inset:0;background:#f0f2f5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:50;transition:opacity .4s;border-radius:12px}
.loading-dots{display:flex;gap:6px}
.ld{width:8px;height:8px;border-radius:50%;background:#FB6001;opacity:.3;animation:pulse 1s ease-in-out infinite}
.ld:nth-child(2){animation-delay:.2s}.ld:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style></head>
