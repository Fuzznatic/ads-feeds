<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:300px;height:600px;overflow:hidden;background:transparent;font-family:'Inter Tight',system-ui,sans-serif;cursor:pointer}
#bn{width:300px;height:600px;background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;padding:10px;gap:9px;position:relative}
#hd{height:33px;flex:0 0 33px;display:flex;align-items:center;justify-content:center;gap:6px}
#hd img{max-height:20px;max-width:228px;object-fit:contain}
#hk{display:none;flex:0 0 auto;background:#FB6001;color:#fff;font-size:9px;font-weight:900;padding:3px 7px;border-radius:999px;white-space:nowrap}
#cards{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px}
.cd{flex:1 1 264px;min-height:0;border:1px solid #f0f2f6;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;
    background:#fff;position:relative;box-shadow:0 1px 2px rgba(0,23,41,.05);
    opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.3,1)}
.cd.in{opacity:1;transform:none}
.cd .im{height:169px;flex:0 0 169px;background:#fff;padding:7px 9px 3px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cd .im img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.cd .tx{flex:1;min-height:0;padding:0 9px 8px;display:flex;flex-direction:column;gap:2px}
.mc{font-size:11px;font-weight:800;color:#9aa8b8;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt{font-size:13.5px;font-weight:700;color:#001729;line-height:1.25;letter-spacing:-.005em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.pr{display:flex;align-items:baseline;gap:5px;margin-top:auto;padding-top:3px}
/* Pfeil pro Karte: macht jede Karte fuer sich als klickbar lesbar, ohne dass
   eine globale Schaltflaeche etwas verspricht, das sie nicht halten kann. */
.go{position:absolute;right:8px;bottom:8px;width:24px;height:24px;border-radius:999px;
    background:#FB6001;color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:900;line-height:1;box-shadow:0 2px 5px #FB600140}
.p1{font-size:24px;font-weight:900;color:#FB6001;line-height:1;letter-spacing:-.02em}
.p0{font-size:11.5px;color:#a9b4c2;text-decoration:line-through;font-weight:600}
.dc{position:absolute;top:6px;right:6px;background:#FB6001;color:#fff;font-size:8.5px;font-weight:900;padding:2px 6px;border-radius:999px;box-shadow:0 1px 3px rgba(0,23,41,.18)}
.swap{animation:sw .5s ease}
@keyframes sw{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}

/* Das Maskottchen sitzt HINTER der CTA-Pille und schiebt sich darunter hervor. */
#ms{position:absolute;right:-16px;bottom:6px;width:88px;height:90px;z-index:4;
    transform:translateY(98px) rotate(6deg);opacity:0;transform-origin:bottom right;
    transition:transform .55s cubic-bezier(.2,.9,.3,1.1),opacity .3s ease;pointer-events:none}
#ms.peek{transform:translateY(0) rotate(-3deg);opacity:1}
#ms img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 3px 8px rgba(0,23,41,.18))}
@media (prefers-reduced-motion:reduce){
  .cd{transition:none;opacity:1;transform:none}
  #ms{display:none}
}
</style></head><body>

      var dd=pool[k],pn=_num(dd.price),wn=_num(dd.wasPrice);
      var pc=dd.discount?Math.round(_num(dd.discount)):((pn&&wn>pn)?Math.round((1-pn/wn)*100):0);
      if(pc>best)best=pc;
    }
    var hk=document.getElementById('hk');
    if(hk){ if(true && best>=10){hk.textContent='Up to -'+best+'%';hk.style.display='block';}
            else hk.style.display='none'; }

    // Klick daneben fuehrt auf die Kampagnenseite, nicht auf einen zufaelligen Deal.
    document.body.onclick=function(){_nav(CTA_URL||_addUtm((deals[0]?deals[0].link:'')||'#'),0,deals[0]?deals[0].title:'');};

    startMotion();
  }catch(e){}
}

function startMotion(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  // Maskottchen: einmal, kurz, dann endgueltig weg.
  setTimeout(function(){
    var ms=document.getElementById('ms'); if(!ms)return;
    ms.classList.add('peek');
    setTimeout(function(){ms.classList.remove('peek');},3200);   // laenger sichtbar, wie gewuenscht
  },2500);
  // Deal-Rotation nur, wenn der Feed mehr hergibt als Plaetze da sind.
  if(pool.length>SLOTS && !_rot){
    // Abwechselnd tauschen statt immer dieselbe Karte: bei zwei Plaetzen wirkt
    // es sonst, als haette nur die untere Haelfte Inhalt.
    var next=SLOTS, slot=0;
    _rot=setInterval(function(){
      if(Date.now()-_t0>STOP){clearInterval(_rot);_rot=null;return;}
      var host=document.getElementById('cards'); if(!host)return;
      var c=host.children[slot % SLOTS]; if(!c)return;
      var d=pool[next%pool.length]; next++; slot++;
      fillCard(c,d,slot % SLOTS);
      c.classList.remove('swap');void c.offsetWidth;c.classList.add('swap');
    },3800);
  }
}
build(FALLBACK,true);
function _fdCsv(txt){
  var rows=[],cur=[],f='',inQ=false,i=0,c,n;
  for(;i<txt.length;i++){
    c=txt[i];n=txt[i+1];
    if(inQ){if(c==='"'&&n==='"'){f+='"';i++;}else if(c==='"')inQ=false;else f+=c;}
    else if(c==='"')inQ=true;
    else if(c===','){cur.push(f);f='';}
    else if(c==='\n'||(c==='\r'&&n==='\n')){cur.push(f);f='';if(cur.some(Boolean))rows.push(cur);cur=[];if(c==='\r')i++;}
    else f+=c;
  }
  if(f!==''||cur.length){cur.push(f);if(cur.some(Boolean))rows.push(cur);}
  return rows;
}
var _FDKNOWN=['title','price','oldPrice','wasPrice','discount','imageUrl','image','link','url','merchant','temperature','temp'];
// Sheet rows: headers may sit in row 1 or row 2 (the Deal-Vorlage has a hint row).
function _fdSheet(txt){
  var rows=_fdCsv(txt);if(rows.length<2)return null;
  var r1=rows[1]||[];
  var hits=r1.filter(function(v){return _FDKNOWN.indexOf(v.trim())>=0;}).length;
  var headers,data;
  if(hits>=2&&rows.length>2){headers=r1.map(function(v){return v.trim();});data=rows.slice(2);}
  else{headers=rows[0].map(function(v){return v.trim();});data=rows.slice(1);}
  function cleanP(s){return String(s||'').replace(/,(?!\d{2}(\D|$))/g,'');}
  return data.map(function(r){
    var o={};headers.forEach(function(h,i){if(h)o[h]=r[i]||'';});
    var temp=o.temperature||o.temp||'';
    return{title:o.title||'',price:cleanP(o.price),wasPrice:cleanP(o.wasPrice||o.oldPrice||''),
      discount:o.discount||'',imageUrl:o.imageUrl||o.image||'',link:o.link||o.url||'#',
      merchant:o.merchant||'',temperature:temp,subtitle:temp};
  }).filter(function(d){return d.title||d.imageUrl;});
}
// JSON feed or Sheet CSV — decided by the first non-space character.
function _fdRows(txt){
  var t=String(txt||'').replace(/^\uFEFF/,''),i=0;
  while(i<t.length&&(t[i]===' '||t[i]==='\n'||t[i]==='\r'||t[i]==='\t'))i++;
  if(t[i]==='{'||t[i]==='['){var j=JSON.parse(t);var raw=j.data||j;return Array.isArray(raw)?raw:null;}
  return _fdSheet(t);
}
var _FD_ST=false,_FD_SP=true;
function _fdTemp(v){var m=String(v==null?'':v).match(/-?\d+([.,]\d+)?/);return m?parseFloat(m[0].replace(',','.')):0;}
// Schalter aus dem Studio auf die Zeilen anwenden, BEVOR sortiert wird:
// sonst sortiert die Temperatur noch, obwohl sie gar nicht gezeigt wird.
// Ohne Preis fallen auch Streichpreis und Rabatt weg — ein durchgestrichener
// alter Preis ohne aktuellen daneben ergibt keinen Sinn.
function _fdFlags(raw){return raw.map(function(d){
  if(!_FD_ST){d.temperature='';d.subtitle='';}
  if(!_FD_SP){d.price='';d.wasPrice='';d.oldPrice='';d.discount='';}
  return d;});}
function _fdApply(txt){
  try{
    var raw=_fdRows(txt);
    if(!raw||!raw.length)return false;
    raw=_fdFlags(raw);
    raw.sort(function(a,b){return _fdTemp(b.subtitle||b.temperature)-_fdTemp(a.subtitle||a.temperature);});
    build(raw,false);return true;
  }catch(e){return false;}
}
function _fdGet(url,ok,bad){
  try{var req=new XMLHttpRequest();req.open('GET',url,true);req.timeout=6000;
  req.onload=function(){if(req.status===200)ok(req.responseText);else bad();};
  req.onerror=bad;req.ontimeout=bad;req.send();}catch(e){bad();}
}
function loadDeals(){
  var done=function(){build(FALLBACK,true);};
  _fdGet(API_URL,function(t){
    if(_fdApply(t))return;
    _fdGet('https://corsproxy.io/?'+encodeURIComponent(API_URL),function(t2){if(!_fdApply(t2))done();},done);
  },function(){
    _fdGet('https://corsproxy.io/?'+encodeURIComponent(API_URL),function(t2){if(!_fdApply(t2))done();},done);
  });
}
loadDeals();
