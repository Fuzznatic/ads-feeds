.banner{position:relative;display:flex;flex-direction:column;background:#fff;width:300px;height:250px;overflow:hidden;border-radius:12px;font-family:'Inter Tight',system-ui,sans-serif}

.hsl{display:none;flex-direction:column;width:300px}
.hsl.active{display:flex}
.loading{position:absolute;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:50;border-radius:12px;transition:opacity .4s}
.loading-dots{display:flex;gap:6px}.ld{width:8px;height:8px;border-radius:50%;background:#30A83C;opacity:.3;animation:pulse 1s ease-in-out infinite}
.ld:nth-child(2){animation-delay:.2s}.ld:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style></head>

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shortT(t,max){var s=String(t).split(/[-|]/)[0].trim();return s.length>max?s.slice(0,max)+'…':s;}
function hideLoading(){var el=document.getElementById('loading');if(!el)return;el.style.opacity='0';setTimeout(function(){el.remove();},400);}
function build(data,isDemo){
  if(_built)return;_built=true;
  var n=Math.min(data.length,4);
  var deals=data.slice(0,n);
  _tot=n;
  _urls=deals.map(function(d){return d.link||'#';});
  _titles=deals.map(function(d){return d.title||'';});
  var slidesEl=document.getElementById('slides');
  var dotsEl=document.getElementById('dotsWrap');
  if(!slidesEl){hideLoading();return;}
  var html='';
  for(var ii=0;ii<n;ii++){
    var d=deals[ii];
    var was=(d.wasPrice&&true)?'<span style="font-size:10px;color:#7D9AB0;text-decoration:line-through;font-weight:600">'+'$'+esc(String(d.wasPrice||'').replace(/[€$£¥₹]/g,''))+'</span>':'';
    var badge=(d.discount&&true)?'<div style="position:absolute;top:8px;right:8px;background:#30A83C;color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;z-index:2">-'+d.discount+'%</div>':'';
    var merch=(d.merchant&&true)?'<div style="font-size:9px;font-weight:700;color:#7D9AB0;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(d.merchant)+'</div>':'';
    html+='<div class="hsl" data-i="'+ii+'" style="'+(ii===0?'display:flex;':'display:none;')+'flex-direction:column;width:300px">'
      +'<div style="height:142px;flex-shrink:0;background:#DEFDE4;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center">'
      +(d.imageUrl?'<img src="'+esc(d.imageUrl)+'" style="width:100%;height:142px;object-fit:cover;display:block" onerror="this.remove()">':'')
      +'<div style="position:absolute;bottom:0;left:0;right:0;height:43px;background:linear-gradient(to top,rgba(255,255,255,.5),transparent)"></div>'
      +badge+'</div>'
      +'<div style="height:80px;flex-shrink:0;background:#fff;padding:7px 12px;display:flex;flex-direction:column;justify-content:center;gap:3px;overflow:hidden;border-top:1px solid rgba(0,23,41,.06)">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;gap:6px">'
      +'<div style="display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0;flex:1">'+merch
      +'<div style="font-size:11px;font-weight:700;color:#001729;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(shortT(d.title,48))+'</div>'
      +'</div></div>'
      +'<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">'
      +'<div style="display:flex;align-items:baseline;gap:5px;min-width:0">'
      +'<span style="font-size:24px;font-weight:800;color:#30A83C;line-height:1;letter-spacing:-.02em">'+'$'+esc(String(d.price||'').replace(/[€$£¥₹]/g,''))+'</span>'+was+'</div>'
      +'<div data-cta="'+ii+'" style="flex-shrink:0;background:#30A83C;color:#fff;font-size:12px;font-weight:800;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap">Ver oferta →</div>'
      +'</div></div></div>';
  }
  slidesEl.innerHTML=html;
  _slEls=Array.from(slidesEl.querySelectorAll('.hsl'));
  // vertical dot indicators
  for(var i=0;i<n;i++){
    var dot=document.createElement('div');
    dot.style.cssText='width:4px;height:'+(i===0?12:4)+'px;border-radius:2px;background:'+(i===0?'#30A83C':'rgba(0,23,41,.2)')+';transition:background .3s,height .3s';
    dotsEl.appendChild(dot);_dotEls.push(dot);
  }
  // CTA clicks → _nav
  var ctaBtns=slidesEl.querySelectorAll('[data-cta]');
  for(var j=0;j<ctaBtns.length;j++){(function(btn){
    var idx=parseInt(btn.getAttribute('data-cta'));
    btn.addEventListener('click',function(e){e.stopPropagation();_nav(_urls[idx]||'#',idx,_titles[idx]||'');});
  })(ctaBtns[j]);}
  // Slide area click → _tileNav
  var slideEls2=slidesEl.querySelectorAll('.hsl');
  for(var k=0;k<slideEls2.length;k++){(function(sl){
    var idx=parseInt(sl.getAttribute('data-i'));
    sl.addEventListener('click',function(e){if(e.target.closest('[data-cta]'))return;e.stopPropagation();_tileNav(_urls[idx]||'#',idx,_titles[idx]||'');});
  })(slideEls2[k]);}
  // auto-advance
  if(n>1){
    setInterval(function(){
      _slEls[_c].style.display='none';
      _dotEls[_c].style.height='4px';_dotEls[_c].style.background='rgba(0,23,41,.2)';
      _c=(_c+1)%_tot;
      _slEls[_c].style.display='flex';_slEls[_c].style.flexDirection='column';

    },4000);
  }
  if(isDemo){var bnn=document.getElementById('banner');var dm=document.createElement('div');dm.style.cssText='position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#f59e0b;color:#000;font-size:9px;font-weight:900;padding:3px 10px;border-radius:999px;z-index:98;white-space:nowrap';dm.textContent='DEMO DATA';bnn.appendChild(dm);}
  hideLoading();
}
setTimeout(function(){if(!_built)build(FALLBACK,true);},3500);
function loadDeals(){try{var req=new XMLHttpRequest();req.open('GET',API_URL,true);req.timeout=6000;
  req.onload=function(){if(req.status===200){try{var json=JSON.parse(req.responseText);var raw=json.data||json;if(!Array.isArray(raw)||raw.length===0)throw new Error('empty');build(raw,false);}catch(e){build(FALLBACK,true);}}else{build(FALLBACK,true);}};
  req.onerror=function(){build(FALLBACK,true);};req.ontimeout=function(){build(FALLBACK,true);};req.send();}catch(e){build(FALLBACK,true);}}
loadDeals();
</script>
