<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:300px;height:600px;overflow:hidden;background:transparent}
.banner{width:300px;height:600px;font-family:'Inter Tight',system-ui,sans-serif;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative;background:#0d1117}
.banner::after{content:'';position:absolute;inset:0;border-radius:12px;border:1px solid rgba(0,0,0,.15);pointer-events:none;z-index:99}
.grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:2px;padding:2px;overflow:hidden}
.tile{position:relative;overflow:hidden;cursor:pointer;border-radius:4px;background:#1a1d27}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s ease}
.tile:hover img{transform:scale(1.05)}
.tile-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,10,20,.97) 0%,rgba(0,10,20,.6) 65%,transparent 100%);padding:8px 8px 7px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;transform:translateY(100%);opacity:0;transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .33s ease}
.tile-overlay.show{transform:translateY(0);opacity:1}
.tile-title{font-size:10px;font-weight:700;color:#fff;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile-price{font-size:18px;font-weight:900;color:#fff;line-height:1;letter-spacing:-.02em;white-space:nowrap;overflow:hidden}
.tile-price.is-temp{color:#E8121A}
.brand-bar{height:68px;flex-shrink:0;background:#1d1f20;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px;position:relative;overflow:hidden}
.brand-bar::before{content:'';position:absolute;right:-24px;top:-24px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.04)}
.brand-info{display:flex;flex-direction:column;gap:3px;z-index:1}
.cta-btn{z-index:1;background:#30A83C;color:#fff;font-size:11px;font-weight:800;padding:9px 14px;border-radius:999px;text-align:center;cursor:pointer;white-space:nowrap;flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.3);transition:background .2s}
.cta-btn:hover{background:#005D09}
.slogan{font-size:9px;font-weight:600;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-badge{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#f59e0b;color:#000;font-size:9px;font-weight:900;padding:3px 10px;border-radius:999px;letter-spacing:.06em;z-index:98;text-transform:uppercase;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.loading{position:absolute;inset:0;background:#0d1117;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:50;transition:opacity .4s;border-radius:12px}
.loading-dots{display:flex;gap:6px}
.ld{width:8px;height:8px;border-radius:50%;background:#30A83C;opacity:.3;animation:pulse 1s ease-in-out infinite}
.ld:nth-child(2){animation-delay:.2s}.ld:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style></head>
<body>
<div class="banner" id="banner">
  <div class="loading" id="loading">
    <svg viewBox="0 0 300 36" width="110" height="20" fill="none"><text x="0" y="26" font-family="Inter Tight,sans-serif" font-weight="900" font-size="26" fill="#30A83C">Promodescuentos</text></svg>
    <div class="loading-dots"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="brand-bar">
    <div class="brand-info"><svg viewBox="0 0 300 36" width="110" height="20" fill="none"><text x="0" y="26" font-family="Inter Tight,sans-serif" font-weight="900" font-size="26" fill="#30A83C">Promodescuentos</text></svg><div class="slogan">Comunidad de ofertas en México</div></div>
    <div class="cta-btn" id="cta">Ver oferta → &rarr;</div>
  </div>
</div>
<script>
var clickTag=(new URLSearchParams(window.location.search).get('click'))||'';
var API_URL='https://raw.githubusercontent.com/Fuzznatic/ads-feeds/main/feeds/es.json';
var deals=[],_built=false;
var FALLBACK=[{"title":"Rising Sun: Dynasty Invasion","subtitle":"822","imageUrl":"https://static.promodescuentos.com/threads/raw/XCHQI/1155626_1/re/1024x1024/qt/60/1155626_1.jpg","link":"https://www.promodescuentos.com/ofertas/rising-sun-dynasty-invasion-1155626"},{"title":"Suavel Papel Higiénic","subtitle":"160","imageUrl":"https://static.promodescuentos.com/threads/raw/ajHIw/1154142_1/re/1024x1024/qt/60/1154142_1.jpg","link":"https://www.promodescuentos.com/ofertas/suavel-papel-higienico-40-rollos-con-213-hojas-dobles-con-textura-de-colores-y-aroma-agradable-1154142"},{"title":"Amazon: T-Fal Signature juego de 12 utensilios","subtitle":"1.920","imageUrl":"https://static.promodescuentos.com/threads/raw/EwheF/1154883_1/re/1024x1024/qt/60/1154883_1.jpg","link":"https://www.promodescuentos.com/ofertas/t-fal-signature-juego-de-12-utensilios-1154883"},{"title":"Star Wars The Black Series, Luke Skywalker","subtitle":"391","imageUrl":"https://static.promodescuentos.com/threads/raw/k5EEH/1155801_1/re/1024x1024/qt/60/1155801_1.jpg","link":"https://www.promodescuentos.com/ofertas/star-wars-the-black-series-luke-skywalker-nueva-esperanza-figura-de-accion-coleccionable-de-15-cm-1155801"}];
function parseTemp(s){return parseFloat(String(s||'').replace(/[^0-9.]/g,''))||0;}
function shortTitle(t,max){var s=String(t).split(/[-|]/)[0].trim();return s.length>max?s.slice(0,max)+'...':s;}
function hideLoading(){var el=document.getElementById('loading');if(!el)return;el.style.opacity='0';setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},400);}
function build(data,isDemo){
  if(_built)return;_built=true;
  try{
    deals=data.slice(0,6);
    var grid=document.getElementById('grid');if(!grid){hideLoading();return;}grid.innerHTML='';
    if(isDemo){var badge=document.createElement('div');badge.className='demo-badge';badge.textContent='DEMO DATA';document.getElementById('banner').appendChild(badge);}
    for(var i=0;i<deals.length;i++){(function(d,idx){
      var rawSub=String(d.subtitle||'');var isTemp=rawSub.length>0;var tempNum=parseTemp(rawSub);
      var tile=document.createElement('div');tile.className='tile';
      var img=document.createElement('img');img.src=d.imageUrl||'';img.onerror=function(){this.style.display='none';};tile.appendChild(img);
      var ov=document.createElement('div');ov.className='tile-overlay';ov.id='ov'+idx;
      var ttl=document.createElement('div');ttl.className='tile-title';ttl.textContent=shortTitle(d.title,42);ov.appendChild(ttl);
      var pr=document.createElement('div');pr.className='tile-price'+(isTemp?' is-temp':'');pr.textContent=isTemp?(tempNum.toLocaleString()+'°'):(d.price||'');ov.appendChild(pr);
      tile.appendChild(ov);
      tile.addEventListener('click',function(e){e.stopPropagation();if(clickTag&&clickTag.indexOf('%%')===-1)new Image().src=clickTag;window.open(d.link||'#','_blank');});
      grid.appendChild(tile);
    })(deals[i],i);}
    var ovls=document.querySelectorAll('.tile-overlay');var active=-1,tot=ovls.length;
    function hide(i){if(ovls[i])ovls[i].classList.remove('show');}function show(i){if(ovls[i])ovls[i].classList.add('show');}
    function next(){try{hide(active);active=(active+1)%tot;show(active);setTimeout(next,2000);}catch(ex){}}
    if(tot>0)setTimeout(next,600);
    var tiles=document.querySelectorAll('.tile');
    for(var j=0;j<tiles.length;j++){(function(t,i){t.addEventListener('mouseenter',function(){show(i);});t.addEventListener('mouseleave',function(){if(i!==active)hide(i);});})(tiles[j],j);}
    var ctaEl=document.getElementById('cta');
    if(ctaEl){ctaEl.addEventListener('click',function(e){e.stopPropagation();if(clickTag&&clickTag.indexOf('%%')===-1)new Image().src=clickTag;window.open(deals[0]?deals[0].link:'#','_blank');});}
  }catch(e){}
  hideLoading();
}
setTimeout(function(){if(!_built)build(FALLBACK,true);},8000);
function loadDeals(){try{var req=new XMLHttpRequest();req.open('GET',API_URL,true);req.timeout=6000;
  req.onload=function(){if(req.status===200){try{var json=JSON.parse(req.responseText);var raw=json.data||json;if(!Array.isArray(raw)||raw.length===0)throw new Error('empty');raw.sort(function(a,b){return parseTemp(b.subtitle)-parseTemp(a.subtitle);});build(raw,false);}catch(e){build(FALLBACK,true);}}else{build(FALLBACK,true);}};
  req.onerror=function(){build(FALLBACK,true);};req.ontimeout=function(){build(FALLBACK,true);};req.send();}catch(e){build(FALLBACK,true);}}
loadDeals();
</script>
</body></html>
