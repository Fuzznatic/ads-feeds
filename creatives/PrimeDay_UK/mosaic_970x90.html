<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:970px;height:90px;overflow:hidden;background:transparent}
.banner{width:970px;height:90px;font-family:'Inter Tight',system-ui,sans-serif;background:#fff;border-radius:12px;overflow:hidden;display:flex;align-items:center;position:relative;border:1px solid #e6edf2}
.bp{flex:none;width:165px;height:100%;display:flex;align-items:center;justify-content:center;padding:0 12px;cursor:pointer}
.prow{flex:1;display:flex;align-items:center;justify-content:space-around;gap:10px;padding:0 10px;min-width:0;overflow:hidden}
.pc{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.pi{position:relative;width:68px;height:68px;flex:none;border-radius:8px;background:#eef2f6;overflow:hidden}
.pi img{width:100%;height:100%;object-fit:cover;display:block}
.pinf{display:flex;flex-direction:column;gap:1px;min-width:0}
.pr{font-size:18px;font-weight:900;color:#001729;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.pr.is-temp{color:#E8121A}
.pw{font-size:11px;color:#7D9AB0;text-decoration:line-through;font-weight:600;white-space:nowrap}
.pt{font-size:10px;color:#5c7184;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:158px}
.disc{position:absolute;top:5px;left:5px;z-index:3;background:#FB6001;color:#fff;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;line-height:1.35;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.cta{flex:none;margin:0 12px 0 6px;background:#FB6001;color:#fff;font-weight:800;font-size:14px;padding:9px 16px;border-radius:999px;white-space:nowrap;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.demo-badge{position:absolute;top:5px;left:50%;transform:translateX(-50%);background:#f59e0b;color:#000;font-size:9px;font-weight:900;padding:2px 9px;border-radius:999px;letter-spacing:.06em;z-index:98;text-transform:uppercase;white-space:nowrap}
.loading{position:absolute;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;z-index:50;transition:opacity .4s;border-radius:12px}
.ld{width:8px;height:8px;border-radius:50%;background:#FB6001;opacity:.3;animation:pulse 1s ease-in-out infinite}
.ld:nth-child(2){animation-delay:.2s}.ld:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style></head>

    var ctaEl=document.getElementById('cta');var ctaBtn=document.getElementById('ctabtn');
