*{margin:0;padding:0;box-sizing:border-box}
body{width:300px;height:250px;overflow:hidden;background:transparent}
.banner{width:300px;height:250px;font-family:'Inter Tight',system-ui,sans-serif;background:#fff;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;position:relative}

.sl{display:none;flex-direction:column;width:300px}
.sl.active{display:flex}
.loading{position:absolute;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:50;border-radius:12px;transition:opacity .4s}
.loading-dots{display:flex;gap:6px}.ld{width:8px;height:8px;border-radius:50%;background:#30A83C;opacity:.3;animation:pulse 1s ease-in-out infinite}
.ld:nth-child(2){animation-delay:.2s}.ld:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.cta-btn{background:#30A83C;color:#fff;font-size:12px;font-weight:800;height:100%;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer}
</style></head>
