<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:300px;height:600px;overflow:hidden;background:transparent;font-family:'Inter Tight',system-ui,sans-serif;cursor:pointer}
#bn{width:300px;height:600px;background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;padding:12px;gap:7px}
#hd{height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:space-between;gap:6px}
#hd img{max-height:30px;max-width:230px;object-fit:contain}
#ad{background:rgba(0,23,41,.06);color:#8fa0b2;font-size:8px;font-weight:700;padding:2px 6px;border-radius:999px;white-space:nowrap}
#cd{flex:1;min-height:0;border:1px solid #f0f2f6;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;
    background:#fff;position:relative;box-shadow:0 1px 2px rgba(0,23,41,.05);}
/* Symmetrisches Padding: das Produkt sitzt damit optisch mittig, nicht leicht zu hoch. */
/* Bild waechst in den freien Raum: bei einem einzelnen Deal blieben sonst
   ueber 100px Weissraum zwischen Titel und Preis stehen. min-height haelt es
   auch dann gross genug, wenn der Titel drei Zeilen braucht. */
#im{flex:1 1 auto;min-height:213px;background:#fff;
    padding:12px 14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#im img{max-width:100%;max-height:100%;object-fit:contain;display:block}
#tx{flex:0 0 auto;padding:0 14px 14px;display:flex;flex-direction:column;gap:4px}
#mc{font-size:12.5px;font-weight:800;color:#9aa8b8;letter-spacing:.07em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
#ttl{font-size:16px;font-weight:700;color:#001729;line-height:1.25;letter-spacing:-.005em;overflow:hidden;
     display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
#tmp{display:none;align-items:center;gap:2px;font-size:8.5px;font-weight:800;color:#e8622a;background:#fff3ed;
     border-radius:999px;padding:1px 6px;align-self:flex-start}
#pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;padding-top:6px}
#p1{font-size:30px;font-weight:900;color:#00A1AE;line-height:1;letter-spacing:-.025em}
#p0{font-size:13px;color:#a9b4c2;text-decoration:line-through;font-weight:600;display:none}
#dc{position:absolute;top:10px;right:10px;background:#00A1AE;color:#fff;
    font-size:11px;font-weight:900;padding:3px 8px;border-radius:999px;display:none;
    box-shadow:0 1px 3px rgba(0,23,41,.18)}
#ct{height:51px;flex:0 0 51px;background:#00A1AE;color:#fff;border-radius:999px;display:flex;
    align-items:center;justify-content:center;white-space:nowrap;font-size:17px;font-weight:800;
    letter-spacing:.005em;box-shadow:0 2px 6px #00A1AE33}
</style></head><body>

    if(wv&&pv&&true){p0.textContent=CURP+wv+CURS;p0.style.display='block';}else{p0.style.display='none';}
    var dTxt=_skyDisc(d.price,d.wasPrice,d.discount), dc=document.getElementById('dc');
    if(dTxt&&pv&&true){dc.textContent=dTxt;dc.style.display='block';}else{dc.style.display='none';}
    var tv=_num(d.temperature||d.subtitle), tm=document.getElementById('tmp');
    if(_FD_ST&&tv>=500){tm.textContent='🔥 '+Math.round(tv)+'°';tm.style.display='inline-flex';}else{tm.style.display='none';}
    var go=function(e){e&&e.stopPropagation();_nav(CTA_URL||_addUtm(d.link||'#'),0,d.title||'');};
    document.getElementById('ct').onclick=go;
    document.getElementById('cd').onclick=function(e){e.stopPropagation();_tileNav(_addUtm(d.link||'#'),0,d.title||'');};
    document.body.onclick=go;
    _built=true;
  }catch(e){}
}
build(FALLBACK,true);
function _fdCsv(txt){
  var rows=[],cur=[],f='',inQ=false,i=0,c,n;
  for(;i<txt.length;i++){
    c=txt[i];n=txt[i+1];
    if(inQ){if(c==='"'&&n==='"'){f+='"';i++;}else if(c==='"')inQ=false;else f+=c;}
    else if(c==='"')inQ=true;
    else if(c===','){cur.push(f);f='';}
    else if(c==='\n'||(c==='\r'&&n==='\n')){cur.push(f);f='';if(cur.some(Boolean))rows.push(cur);cur=[];if(c==='\r')i++;}
    else f+=c;
  }
  if(f!==''||cur.length){cur.push(f);if(cur.some(Boolean))rows.push(cur);}
  return rows;
}
var _FDKNOWN=['title','price','oldPrice','wasPrice','discount','imageUrl','image','link','url','merchant','temperature','temp'];
// Sheet rows: headers may sit in row 1 or row 2 (the Deal-Vorlage has a hint row).
function _fdSheet(txt){
  var rows=_fdCsv(txt);if(rows.length<2)return null;
  var r1=rows[1]||[];
  var hits=r1.filter(function(v){return _FDKNOWN.indexOf(v.trim())>=0;}).length;
  var headers,data;
  if(hits>=2&&rows.length>2){headers=r1.map(function(v){return v.trim();});data=rows.slice(2);}
  else{headers=rows[0].map(function(v){return v.trim();});data=rows.slice(1);}
  function cleanP(s){return String(s||'').replace(/,(?!\d{2}(\D|$))/g,'');}
  return data.map(function(r){
    var o={};headers.forEach(function(h,i){if(h)o[h]=r[i]||'';});
    var temp=o.temperature||o.temp||'';
    return{title:o.title||'',price:cleanP(o.price),wasPrice:cleanP(o.wasPrice||o.oldPrice||''),
      discount:o.discount||'',imageUrl:o.imageUrl||o.image||'',link:o.link||o.url||'#',
      merchant:o.merchant||'',temperature:temp,subtitle:temp};
  }).filter(function(d){return d.title||d.imageUrl;});
}
// JSON feed or Sheet CSV — decided by the first non-space character.
function _fdRows(txt){
  var t=String(txt||'').replace(/^\uFEFF/,''),i=0;
  while(i<t.length&&(t[i]===' '||t[i]==='\n'||t[i]==='\r'||t[i]==='\t'))i++;
  if(t[i]==='{'||t[i]==='['){var j=JSON.parse(t);var raw=j.data||j;return Array.isArray(raw)?raw:null;}
  return _fdSheet(t);
}
var _FD_ST=false,_FD_SP=true;
function _fdTemp(v){var m=String(v==null?'':v).match(/-?\d+([.,]\d+)?/);return m?parseFloat(m[0].replace(',','.')):0;}
// Schalter aus dem Studio auf die Zeilen anwenden, BEVOR sortiert wird:
// sonst sortiert die Temperatur noch, obwohl sie gar nicht gezeigt wird.
// Ohne Preis fallen auch Streichpreis und Rabatt weg — ein durchgestrichener
// alter Preis ohne aktuellen daneben ergibt keinen Sinn.
function _fdFlags(raw){return raw.map(function(d){
  if(!_FD_ST){d.temperature='';d.subtitle='';}
  if(!_FD_SP){d.price='';d.wasPrice='';d.oldPrice='';d.discount='';}
  return d;});}
function _fdApply(txt){
  try{
    var raw=_fdRows(txt);
    if(!raw||!raw.length)return false;
    raw=_fdFlags(raw);
    build(raw,false);return true;
  }catch(e){return false;}
}
function _fdGet(url,ok,bad){
  try{var req=new XMLHttpRequest();req.open('GET',url,true);req.timeout=6000;
  req.onload=function(){if(req.status===200)ok(req.responseText);else bad();};
  req.onerror=bad;req.ontimeout=bad;req.send();}catch(e){bad();}
}
function loadDeals(){
  var done=function(){build(FALLBACK,true);};
  _fdGet(API_URL,function(t){
    if(_fdApply(t))return;
    _fdGet('https://corsproxy.io/?'+encodeURIComponent(API_URL),function(t2){if(!_fdApply(t2))done();},done);
  },function(){
    _fdGet('https://corsproxy.io/?'+encodeURIComponent(API_URL),function(t2){if(!_fdApply(t2))done();},done);
  });
}
loadDeals();
