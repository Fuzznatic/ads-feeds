<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:300px;height:600px;overflow:hidden;background:transparent}
.banner{width:300px;height:600px;font-family:'Inter Tight',system-ui,sans-serif;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative;background:#f0f2f5}
.banner::after{content:'';position:absolute;inset:0;border-radius:12px;border:1px solid rgba(0,0,0,.1);pointer-events:none;z-index:99}
.grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:2px;padding:2px;background:#f0f2f5;overflow:hidden}
.tile{position:relative;overflow:hidden;cursor:pointer;border-radius:4px;background:#fff0e8}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s ease}
.tile:hover img{transform:scale(1.05)}
.tile-overlay{position:absolute;bottom:0;left:0;right:0;max-height:100%;background:linear-gradient(to top,rgba(0,10,20,.97) 0%,rgba(0,10,20,.6) 65%,transparent 100%);padding:8px 8px 7px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden;transform:translateY(100%);opacity:0;transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .33s ease}
.tile-overlay.show{transform:translateY(0);opacity:1}
.tile-merchant{font-size:8px;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-title{font-size:12px;font-weight:700;color:#fff;line-height:1.25;overflow:hidden;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile-prow{display:flex;align-items:baseline;gap:3px;flex-wrap:nowrap;margin-top:1px;overflow:hidden;min-width:0}
.tile-was{font-size:11px;color:rgba(255,255,255,.5);text-decoration:line-through;font-weight:600;flex-shrink:0}
.tile-price{font-size:25px;font-weight:900;color:#fff;line-height:1;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
.tile-price.is-temp{color:#E8121A}
.tile-disc{position:absolute;top:6px;right:6px;z-index:3;background:#FB6001;color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;line-height:1.15;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.brand-bar{height:68px;flex-shrink:0;background:#fff;border-top:1px solid #e8eef2;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px;position:relative;overflow:hidden}
.brand-info{display:flex;flex-direction:column;gap:3px;z-index:1;min-width:0;overflow:hidden;width:100%}
.cta-btn{z-index:1;background:#FB6001;color:#fff;font-size:11px;font-weight:800;padding:9px 14px;border-radius:999px;text-align:center;cursor:pointer;white-space:nowrap;flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.18);transition:opacity .2s;animation:shimmer 2.5s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.8}}
.cta-btn:hover{opacity:.9}
.slogan{font-size:9px;font-weight:600;color:rgba(0,23,41,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style></head>

function _csv(txt){
  var rows=[],cur=[],f='',inQ=false,i=0,c,n;
  for(;i<txt.length;i++){
    c=txt[i];n=txt[i+1];
    if(inQ){if(c==='"'&&n==='"'){f+='"';i++;}else if(c==='"')inQ=false;else f+=c;}
    else if(c==='"')inQ=true;
    else if(c===','){cur.push(f);f='';}
    else if(c==='

')){cur.push(f);f='';if(cur.some(Boolean))rows.push(cur);cur=[];if(c==='')i++;}
    else f+=c;
  }
  if(f!==''||cur.length){cur.push(f);if(cur.some(Boolean))rows.push(cur);}
  return rows;
}
var _KNOWN=['title','price','oldPrice','wasPrice','discount','imageUrl','image','link','url','merchant','temperature','temp'];
function _parse(txt){

  var hits=r1.filter(function(v){return _KNOWN.indexOf(v.trim())>=0;}).length;

  if(hits>=2&&rows.length>2){headers=r1.map(function(v){return v.trim();});data=rows.slice(2);}
  else{headers=rows[0].map(function(v){return v.trim();});data=rows.slice(1);}
  if(!data.length)return null;
  return data.map(function(r){
    var o={};headers.forEach(function(h,i){if(h)o[h]=r[i]||'';});
    var price=o.price||'',temp=o.temperature||o.temp||'';
    var isTemp=!price&&!!temp;
    function cleanP(s){return s.replace(/,(?!d{2}(D|$))/g,'');}
    return{title:o.title||'',price:isTemp?'':cleanP(price),wasPrice:cleanP(o.wasPrice||o.oldPrice||''),
      temperature:temp,isTemp:isTemp,discount:o.discount||'',imageUrl:o.imageUrl||o.image||'',link:o.link||o.url||'#',merchant:o.merchant||''};

}
