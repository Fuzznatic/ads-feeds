<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:300px;height:600px;overflow:hidden;background:transparent}
.banner{width:300px;height:600px;font-family:'Inter Tight',system-ui,sans-serif;background:#fff0e8;position:relative;overflow:hidden;display:flex;flex-direction:column}
.banner::after{content:'';position:absolute;inset:0;border:1px solid rgba(0,0,0,.1);pointer-events:none;z-index:99}
.loading{position:absolute;inset:0;background:#fff0e8;display:flex;align-items:center;justify-content:center;gap:10px;z-index:50;transition:opacity .4s}
.loading-dots{display:flex;gap:5px}.ld{width:7px;height:7px;border-radius:50%;background:#FB6001;opacity:.3;animation:pulse 1s ease-in-out infinite}
.ld:nth-child(2){animation-delay:.2s}.ld:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style></head>

function hideLoading(){var el=document.getElementById('loading');if(!el)return;el.style.opacity='0';setTimeout(function(){el.remove();},400);}
function build(data,isDemo){
  if(_built)return;_built=true;
  // Random product pick — different product on each impression
  var d=data[Math.floor(Math.random()*data.length)];
  if(!d){hideLoading();return;}
  if(d.imageUrl){
    if(_light){var pi=document.getElementById('prodimg');if(pi){pi.src=d.imageUrl;pi.style.display='block';}}
    else{document.getElementById('bgimg').style.backgroundImage='url('+d.imageUrl+')';}
  }
  document.getElementById('ttl').textContent=d.title||'';
  document.getElementById('prc').textContent='£'+String(d.price||'').replace(/[€$£¥₹]|zł/gi,'')+'';
  var wa=document.getElementById('was');if(d.wasPrice&&true){wa.textContent='£'+String(d.wasPrice||'').replace(/[€$£¥₹]|zł/gi,'')+'';wa.style.display='inline';}
  var bg=document.getElementById('bdg');if(d.discount&&true){bg.textContent=d.discount+'% OFF';bg.style.display='inline-block';}
  var mc=document.getElementById('merch');if(d.merchant&&false){mc.textContent=d.merchant;mc.style.display='block';}
  if(isDemo){var bnn=document.getElementById('banner');var dm=document.createElement('div');dm.style.cssText='position:absolute;top:4px;left:50%;transform:translateX(-50%);background:#f59e0b;color:#000;font-size:9px;font-weight:900;padding:2px 8px;border-radius:999px;z-index:98;white-space:nowrap';dm.textContent='DEMO DATA';bnn.appendChild(dm);}

  document.getElementById('ctabtn').addEventListener('click',function(e){e.stopPropagation();_nav(CTA_URL||link,0,title);});
  hideLoading();
}
