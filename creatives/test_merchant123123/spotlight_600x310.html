<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:600px;height:310px;margin:0;overflow:hidden;background:transparent}
.banner{width:600px;height:310px;font-family:'Inter Tight',system-ui,sans-serif;background:#ffffff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;border:1px solid rgba(0,0,0,.08);box-shadow:0 2px 14px rgba(0,0,0,.10);position:relative;}

.sp-hdr{height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid rgba(0,0,0,.08)}
.sp-hl{display:flex;align-items:center;gap:8px;min-width:0}
.sp-div{width:1px;height:14px;background:rgba(0,0,0,.08);flex-shrink:0}
.sp-name{font-size:11px;font-weight:800;color:#001729;letter-spacing:-.01em;white-space:nowrap;flex-shrink:0}
.sp-extra{font-size:11px;font-weight:600;color:#001729;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sp-ad{font-size:8.5px;font-weight:700;color:rgba(0,23,41,.5);text-transform:uppercase;letter-spacing:.08em;border:1px solid rgba(0,0,0,.08);padding:2px 7px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.sp-row{flex:1;display:flex;gap:6px;padding:8px;overflow:hidden}
.sp-tile{flex:1 1 0;min-width:0;background:#f4f6f8;border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;border:1px solid rgba(0,0,0,.08);transition:box-shadow .2s}
.sp-tile:hover{box-shadow:0 5px 18px rgba(0,0,0,.20)}
.sp-img{position:relative;height:151px;background:#ffffff;overflow:hidden}
.sp-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.sp-tile:hover .sp-img img{transform:scale(1.06)}
.sp-disc{position:absolute;top:5px;right:5px;background:#30A83C;color:#fff;font-size:9px;font-weight:800;padding:1px 6px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sp-txt{padding:5px 7px 6px;display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.sp-merch{font-size:8px;font-weight:700;color:rgba(0,23,41,.5);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-title{font-size:10px;font-weight:700;color:#001729;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sp-prow{display:flex;align-items:baseline;gap:4px;margin-top:auto}
.sp-was{font-size:9px;color:rgba(0,23,41,.5);text-decoration:line-through;font-weight:600;flex-shrink:0}
.sp-price{font-size:14px;font-weight:900;color:#30A83C;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-price.is-temp{color:#E8121A}
.demo-badge{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#f59e0b;color:#000;font-size:9px;font-weight:900;padding:3px 10px;border-radius:999px;letter-spacing:.06em;z-index:98;text-transform:uppercase;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.loading{position:absolute;inset:0;background:#ffffff;display:flex;align-items:center;justify-content:center;gap:6px;z-index:50;transition:opacity .4s;border-radius:14px}
.ld{width:8px;height:8px;border-radius:50%;background:#30A83C;opacity:.3;animation:pulse 1s ease-in-out infinite}
.ld:nth-child(2){animation-delay:.2s}.ld:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style></head>
