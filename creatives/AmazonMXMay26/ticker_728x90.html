  st.textContent='@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-'+totalW+'px)}}#ticker-track{animation:ticker '+dur+'s linear infinite}#ticker-track:hover{animation-play-state:paused}';
  document.head.appendChild(st);
  var items=track.querySelectorAll('[data-i]');
  for(var j=0;j<items.length;j++){(function(el){
    var idx=parseInt(el.getAttribute('data-i'));
    el.addEventListener('click',function(e){e.stopPropagation();_tileNav(urls[idx]||'#',idx,titles[idx]||'');});
  })(items[j]);}
  var ctaBtn=document.getElementById('ctabtn');
  if(ctaBtn) ctaBtn.addEventListener('click',function(e){e.stopPropagation();_nav(urls[0]||'#',0,titles[0]||'');});
  if(isDemo){var bnn=document.getElementById('banner');var dm=document.createElement('div');dm.style.cssText='position:absolute;top:4px;left:50%;transform:translateX(-50%);background:#f59e0b;color:#000;font-size:9px;font-weight:900;padding:2px 8px;border-radius:999px;z-index:98;white-space:nowrap';dm.textContent='DEMO DATA';bnn.appendChild(dm);}
  hideLoading();
}
setTimeout(function(){if(!_built)build(FALLBACK,true);},3500);
function loadDeals(){try{var req=new XMLHttpRequest();req.open('GET',API_URL,true);req.timeout=6000;
  req.onload=function(){if(req.status===200){try{var json=JSON.parse(req.responseText);var raw=json.data||json;if(!Array.isArray(raw)||raw.length===0)throw new Error('empty');build(raw,false);}catch(e){build(FALLBACK,true);}}else{build(FALLBACK,true);}};
  req.onerror=function(){build(FALLBACK,true);};req.ontimeout=function(){build(FALLBACK,true);};req.send();}catch(e){build(FALLBACK,true);}}
loadDeals();
</script>
