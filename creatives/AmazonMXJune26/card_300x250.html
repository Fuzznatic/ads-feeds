<script>
var clickTag='';try{var _cm=location.search.match(/[?&]click=([sS]*)/);clickTag=_cm?_cm[1]:'';}catch(e){}

var _US='dynamicdisplay',_UM='dealcard',_UC='AmazonMXJune26',_UI='',_UX='';
function _addUtm(u){if(!u||u==='#')return u;var p=[];if(_US)p.push('utm_source='+encodeURIComponent(_US));if(_UM)p.push('utm_medium='+encodeURIComponent(_UM));if(_UC)p.push('utm_campaign='+encodeURIComponent(_UC));if(_UI)p.push('utm_content='+encodeURIComponent(_UI));if(_UX)p.push(_UX);if(!p.length)return u;return u+(u.indexOf('?')!==-1?'&':'?')+p.join('&');}
function _trk(t,u,i){if(!_TU)return;try{new Image().src=_TU+'?brand='+encodeURIComponent(_TB)+'&sz='+encodeURIComponent(_TSZ)+'&camp='+encodeURIComponent(_TC)+'&tpl='+encodeURIComponent(_TPL)+'&tile='+encodeURIComponent(i||'')+'&title='+encodeURIComponent(t||'')+'&url='+encodeURIComponent(u||'')+'&ts='+Date.now();}catch(e){}}
function _nav(u,i,t){_trk(t||'',u||'',i);var _ct=(clickTag&&clickTag!==''&&clickTag.indexOf('%%')===-1)?clickTag:'';if(_ct&&_ct.indexOf('adurl=')!==-1){var _m=_ct.match(/([?&]adurl=)([^&]*)/);if(_m&&_m[2]==='')_ct=_ct.replace(/([?&]adurl=)([^&]*)/,'$1'+encodeURIComponent(u||''));}var _d=_ct||(u||'');if(_d&&_d!=='#')window.open(_d,'_blank');}
function _tileNav(u,i,t){_trk(t||'',u||'',i);if(u&&u!=='#')window.open(u,'_blank');}
var API_URL='https://raw.githubusercontent.com/Fuzznatic/ads-feeds/refs/heads/main/feeds/mx-AmazonFeed.json';

function build(data,isDemo){
  if(_built)return;_built=true;
  // Random product pick — different product on each impression
  var d=data[Math.floor(Math.random()*data.length)];
  if(!d){hideLoading();return;}
  var pImg=document.getElementById('pImg');if(pImg&&d.imageUrl){pImg.style.display='';pImg.src=d.imageUrl;}
  document.getElementById('ttl').textContent=d.title||'';
  document.getElementById('prc').textContent='$'+String(d.price||'').replace(/[€$£¥₹]/g,'');
  var wa=document.getElementById('was');if(d.wasPrice&&true){wa.textContent='$'+String(d.wasPrice||'').replace(/[€$£¥₹]/g,'');wa.style.display='block';}
  var bg=document.getElementById('bdg');if(d.discount&&true){bg.textContent='-'+d.discount+'%';bg.style.display='block';}
  var mc=document.getElementById('merch');if(d.merchant&&false){mc.textContent=d.merchant;mc.style.display='block';}
  if(isDemo){var bnn=document.getElementById('banner');var dm=document.createElement('div');dm.style.cssText='position:absolute;top:4px;left:50%;transform:translateX(-50%);background:#f59e0b;color:#000;font-size:9px;font-weight:900;padding:2px 8px;border-radius:999px;z-index:98;white-space:nowrap';dm.textContent='DEMO DATA';bnn.appendChild(dm);}

  document.getElementById('imgwrap').addEventListener('click',function(e){e.stopPropagation();_tileNav(link,0,title);});
  document.getElementById('content').addEventListener('click',function(e){e.stopPropagation();_tileNav(link,0,title);});
  document.getElementById('ctawrap').addEventListener('click',function(e){e.stopPropagation();_nav(CTA_URL||link,0,title);});
  hideLoading();
}
setTimeout(function(){if(!_built)build(FALLBACK,true);},3500);
function loadDeals(){try{var req=new XMLHttpRequest();req.open('GET',API_URL,true);req.timeout=6000;
  req.onload=function(){if(req.status===200){try{var json=JSON.parse(req.responseText);var raw=json.data||json;if(!Array.isArray(raw)||raw.length===0)throw new Error('empty');build(raw,false);}catch(e){build(FALLBACK,true);}}else{build(FALLBACK,true);}};
  req.onerror=function(){build(FALLBACK,true);};req.ontimeout=function(){build(FALLBACK,true);};req.send();}catch(e){build(FALLBACK,true);}}
